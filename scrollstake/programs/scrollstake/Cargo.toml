[package]
name = "scrollstake"
version = "0.1.0"
description = "Group focus-stake escrow with oracle slashing"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "scrollstake"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
